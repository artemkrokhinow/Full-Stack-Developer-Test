version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: limited_drop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/limited_drop?schema=public
      - JWT_SECRET=testsecret
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - db

volumes:
  pgdata:
